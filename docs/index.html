<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de QR - PayTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Generador de códigos QR</h1>
        <p class="subtitle">
          Busca la discoteca, define el número de mesas y genera los QR de
          acceso.
        </p>
      </header>

      <form id="qr-form" class="panel">
        <div class="field">
          <label for="disco-search">Discoteca</label>
          <div class="combobox" id="disco-combobox">
            <input
              id="disco-search"
              type="text"
              placeholder="Busca por nombre o ID..."
              autocomplete="off"
              required />
            <ul id="disco-options" class="combobox-options" hidden></ul>
          </div>
        </div>

        <div class="field">
          <label for="mesas-input">Número de mesas</label>
          <input
            id="mesas-input"
            type="number"
            min="1"
            max="500"
            step="1"
            value="12"
            required />
        </div>

        <div class="field">
          <span class="field-label">Estilo de QR</span>
          <div class="radio-group">
            <label class="radio">
              <input type="radio" name="estilo" value="sin-fondo" />
              Sin fondo
            </label>
            <label class="radio">
              <input type="radio" name="estilo" value="con-fondo" />
              Con fondo
            </label>
            <label class="radio">
              <input type="radio" name="estilo" value="ambos" checked />
              Ambos
            </label>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Formato de salida</span>
          <div class="radio-group">
            <label class="radio">
              <input type="radio" name="formato" value="svg" checked />
              SVG (editable)
            </label>
            <label class="radio">
              <input type="radio" name="formato" value="png" />
              PNG
            </label>
            <label class="radio">
              <input type="radio" name="formato" value="pdf" />
              PDF editable
            </label>
          </div>
        </div>

        <div class="field" id="pdf-options" hidden>
          <div class="field">
            <span class="field-label">Modo de PDF</span>
            <div class="radio-group">
              <label class="radio">
                <input type="radio" name="pdf-modo" value="sencillo" checked />
                Sencillo (1 QR por PDF)
              </label>
              <label class="radio">
                <input type="radio" name="pdf-modo" value="cuadricula" />
                Cuadrícula para litografía
              </label>
            </div>
          </div>

          <div class="field" id="pdf-grid-options" hidden>
            <div class="field">
              <label for="pdf-sheet-size">Tamaño de hoja</label>
              <select id="pdf-sheet-size"></select>
            </div>
            <div class="field">
              <label for="pdf-grid">QRs por página</label>
              <select id="pdf-grid"></select>
            </div>
          </div>
        </div>

        <button type="submit" id="generate-btn">Generar códigos QR</button>
      </form>

      <section id="status" class="status" hidden></section>

      <section id="results" class="results" hidden>
        <div class="results-header">
          <h2>Resultados</h2>
          <button type="button" id="download-zip-btn">
            Descargar todo (.zip)
          </button>
        </div>
        <div id="results-grid" class="results-grid"></div>
      </section>
    </div>

    <!-- Fuente para el header del QR sin fondo (equivalente a Anton/Bebas/Impact del script.py) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet" />

    <style>
      @font-face {
        font-family: "BreathingRegular";
        src: url("assets/BreathingRegular.ttf") format("truetype");
        font-display: block;
      }
    </style>

    <!-- JSZip para empaquetar las imágenes generadas (empaquetado localmente, sin CDN) -->
    <script src="vendor/jszip.min.js"></script>

    <!-- Librería de generación de QR (equivalente a "qrcode" de Python), empaquetada localmente -->
    <script src="vendor/qrcode.min.js"></script>

    <!-- Generación de PDF vectorial (para el formato "PDF editable"), empaquetada localmente -->
    <script src="vendor/jspdf.umd.min.js"></script>

    <script src="assets/background-data.js"></script>
    <script src="assets/fonts-data.js"></script>
    <script src="qr-builder.js"></script>
    <script src="pdf-builder.js"></script>
    <script src="main.js"></script>
  </body>
</html>
